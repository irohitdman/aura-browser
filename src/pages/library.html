<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { height: 100%; overflow: hidden; }
.lib { height: 100%; display: grid; grid-template-columns: 210px minmax(0, 1fr) auto; }
.lib nav { padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); overflow: auto; }
.lib nav .h { padding: 16px 10px 6px; }
.k { display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 10px; border-radius: 9px; width: 100%; }
.k:hover { background: var(--keyhov); }
.k span { color: var(--mute); font-size: 12px; font-family: var(--mono); }
.k.on { background: var(--key); }
main { padding: 20px 22px; overflow: auto; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }
.q { height: 48px; flex: none; }
.q input { font-size: 16px; }
.q kbd { white-space: nowrap; }
.meta { margin-left: auto; color: var(--mute); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card { background: var(--plate); border: 1px solid var(--line); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); width: 100%; }
.card:hover { border-color: var(--alu); }
.card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent30); }
.card .t { height: 150px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--body) top center / cover no-repeat; position: relative; display: grid; place-items: center; }
.card .t.type { font-size: 44px; color: var(--ink); background: var(--body); }
.card .t .sw { position: absolute; inset: 0; display: flex; }
.card .t .sw i { flex: 1; display: block; }
.card .m { padding: 0 6px 6px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .m b { font-weight: 500; }
.card .m span { color: var(--mute); font-size: 11.5px; }
aside { width: 0; overflow: hidden; border-left: 1px solid transparent; transition: width .3s cubic-bezier(.22,.8,.24,1); }
aside.on { width: 380px; border-left-color: var(--line); }
.det { width: 380px; height: 100%; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: none; }
.det .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.det .hd input { font-size: 15px; font-weight: 700; background: none; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; outline: none; min-width: 0; flex: 1; }
.det .hd input:hover, .det .hd input:focus { border-color: var(--line); background: var(--well); }
.x { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--mute); flex: none; }
.x:hover { background: var(--key); color: var(--ink); }
.shot { border-radius: 12px; border: 1px solid var(--line); overflow: hidden; background: var(--body); }
.shot img { width: 100%; display: block; }
.src { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 12px; }
.src a { color: var(--ink); text-decoration: none; font-weight: 500; }
.src a:hover { text-decoration: underline; }
h2 { margin: 0 0 8px; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); display: flex; justify-content: space-between; }
h2 em { font-style: normal; font-family: var(--ui); letter-spacing: 0; text-transform: none; color: var(--mute); font-weight: 400; }
.col { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 6px; border-radius: 10px; width: 100%; }
.col:hover { background: var(--key); }
.col i { width: 22px; height: 22px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); flex: none; }
.col b { font: 500 12.5px var(--mono); width: 74px; }
.col span { color: var(--mute); font-size: 12px; }
.col small { margin-left: auto; color: var(--accent); font-size: 11.5px; }
.face { background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.face .s { font-size: 22px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.face .d { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mute); }
.vals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.vals div { background: var(--plate); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--mute); }
.vals b { font: 500 12px var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { height: 24px; padding: 0 9px; border-radius: 999px; background: var(--plate); border: 1px solid var(--line); display: inline-flex; align-items: center; font-size: 11.5px; color: var(--mute); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.acts .btn { flex: 1; }
textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); font: inherit; outline: none; }
textarea:focus { border-color: var(--accent); }
.spec { background: var(--well); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.spec span { display: block; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="lib">
  <nav id="nav"></nav>
  <main>
    <label class="q"><span class="ic" id="qic"></span><input id="q" placeholder="Try: light, blue accent, Helvetica" autocomplete="off" spellcheck="false" autofocus><kbd>Describe it, any words</kbd></label>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside id="aside"><div class="det" id="det"></div></aside>
</div>
<script src="common.js"></script>
<script src="library.js"></script>
</body>
</html>
