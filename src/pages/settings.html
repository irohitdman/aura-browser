<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { height: 100%; overflow: hidden; }
.st { height: 100%; display: grid; grid-template-columns: 210px minmax(0, 1fr); }
nav { padding: 28px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
nav a { height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 9px; text-decoration: none; color: var(--ink); }
nav a:hover { background: var(--keyhov); }
nav a.on { background: var(--key); }
main { overflow: auto; scroll-behavior: smooth; }
.in { max-width: 720px; padding: 36px 40px 120px; display: flex; flex-direction: column; gap: 44px; }
h1 { margin: 0 0 4px; font-size: 30px; font-weight: var(--wb); letter-spacing: -.02em; }
section h2 { margin: 0 0 4px; font-size: 15px; font-weight: var(--wb); }
section > p { margin: 0 0 14px; color: var(--mute); font-size: 12.5px; line-height: 1.5; max-width: 62ch; }
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set b { font-weight: 500; display: block; }
.set small { display: block; color: var(--mute); font-size: 12px; margin-top: 3px; line-height: 1.45; }
select { height: 32px; border-radius: 9px; background: var(--plate); border: 1px solid var(--line); padding: 0 10px; outline: none; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--plate); border: 1px solid var(--line); }
.seg button { height: 28px; padding: 0 12px; border-radius: 7px; color: var(--mute); font-size: 12.5px; }
.seg button.on { background: var(--key); color: var(--ink); font-weight: 600; }
.tog { width: 34px; height: 20px; border-radius: 999px; background: var(--key); position: relative; box-shadow: inset 0 0 0 1px var(--line); }
.tog i { position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--mute); transition: left .2s; }
.tog.on { background: var(--accent); box-shadow: none; }
.tog.on i { left: 16px; background: var(--onaccent); }
.ok { color: var(--accent); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.sp { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sp .bd { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--plate); border: 1px solid var(--line); }
.sp input[type=text] { background: none; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; outline: none; font-weight: 500; min-width: 0; }
.sp input[type=text]:hover, .sp input[type=text]:focus { border-color: var(--line); background: var(--well); }
.dots { display: flex; gap: 4px; }
.dots button { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(127,127,127,.3); }
.dots button.on { box-shadow: 0 0 0 2px var(--body), 0 0 0 3.5px var(--ink); }
.pw { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pw span { color: var(--mute); font-family: var(--mono); font-size: 12px; }
.pw .a { display: flex; gap: 4px; }
.keys { display: grid; grid-template-columns: 150px minmax(0, 1fr); }
.keys div { padding: 9px 0; border-bottom: 1px solid var(--line); }
.keys kbd { display: inline-block; font: 500 11.5px var(--mono); color: var(--ink); background: var(--key); border-radius: 6px; padding: 3px 7px; }
.note { background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--mute); font-size: 12.5px; line-height: 1.5; }
.note b { color: var(--ink); font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>
<div class="st">
  <nav id="nav"></nav>
  <main id="main"><div class="in" id="in"></div></main>
</div>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
